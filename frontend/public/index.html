<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TumkurSites</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #0f172a;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .logo {
      font-size: 28px;
      font-weight: 800;
      color: #38bdf8;
      margin-bottom: 16px;
      letter-spacing: -0.5px;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(56, 189, 248, 0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .status {
      margin-top: 14px;
      font-size: 13px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="logo">TumkurSites</div>
  <div class="spinner"></div>
  <div class="status">Connecting...</div>

  <script>
    // In live or dev mode, redirect to the hosted or local app URL
    const targetUrl = window.location.origin.includes('localhost') || window.location.origin.includes('capacitor')
      ? 'https://tumkursites.com'
      : window.location.origin;

    setTimeout(() => {
      window.location.href = targetUrl;
    }, 300);
  </script>
</body>
</html>
