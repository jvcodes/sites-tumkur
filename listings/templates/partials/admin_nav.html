<!-- Shared Admin Sidebar Navigation -->
<style>
  .nav-link { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-radius: 8px; color: #94a3b8; text-decoration: none; font-size: 14px; font-weight: 500; transition: background 0.15s, color 0.15s; }
  .nav-link:hover { background: rgba(255,255,255,0.08); color: #fff; }
  .nav-link.active { background: #2563eb; color: #fff; }
  .nav-section { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; color: #475569; text-transform: uppercase; padding: 16px 16px 6px; }
</style>

<aside style="width:240px; min-height:100vh; background:#0f172a; display:flex; flex-direction:column; padding:0; flex-shrink:0;">
  <div style="padding:20px 16px 16px; border-bottom:1px solid #1e293b;">
    <div style="font-size:18px; font-weight:800; color:#fff; letter-spacing:-0.5px;">🏢 SiteHub</div>
    <div style="font-size:11px; color:#64748b; margin-top:2px;">Admin Control Center</div>
  </div>

  <nav style="flex:1; padding:8px;">
    <div class="nav-section">Overview</div>
    <a href="/admin/hub/" class="nav-link {% if request.path == '/admin/hub/' %}active{% endif %}">
      <span>📊</span> Dashboard
    </a>

    <div class="nav-section">Visits</div>
    <a href="/admin/bookings/" class="nav-link {% if 'bookings' in request.path %}active{% endif %}">
      <span>📅</span> Visit Approvals
    </a>

    <div class="nav-section">Agents</div>
    <a href="/admin/agents/" class="nav-link {% if request.path == '/admin/agents/' %}active{% endif %}">
      <span>👥</span> Manage Agents
    </a>

    <div class="nav-section">Sites</div>
    <a href="/admin/sites/pending/" class="nav-link {% if 'pending' in request.path %}active{% endif %}">
      <span>⏳</span> Pending Approvals
    </a>
    <a href="/admin/sites/upload/" class="nav-link {% if 'upload' in request.path %}active{% endif %}">
      <span>⬆️</span> Upload Site
    </a>

    <div class="nav-section" style="margin-top:auto;"></div>
    <a href="/agent/portal/" class="nav-link" style="margin-top:8px; border:1px solid #1e293b;">
      <span>🔗</span> Agent Portal
    </a>
  </nav>

  <div style="padding:12px 16px; border-top:1px solid #1e293b;">
    <a href="http://localhost:3000" target="_blank" style="display:flex; align-items:center; gap:8px; color:#94a3b8; text-decoration:none; font-size:13px; font-weight:500; padding:8px 10px; border-radius:8px; border:1px solid #1e293b; transition:background 0.15s;" onmouseover="this.style.background='rgba(255,255,255,0.06)'" onmouseout="this.style.background='transparent'">
      <span>🏠</span> Back to SiteHub
    </a>
    <div style="font-size:11px; color:#334155; margin-top:8px; padding:0 4px;">Logged in as superuser</div>
  </div>
</aside>
