<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — SiteHub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      margin: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
  </style>
</head>
<body>
  <div class="bg-white rounded-2xl p-6 sm:p-9 w-full max-w-[390px] shadow-2xl">
    <div class="text-center mb-6">
      <div class="w-14 h-14 rounded-2xl bg-blue-50 border border-blue-100 flex items-center justify-center text-3xl mx-auto mb-3 shadow-xs">
        🔒
      </div>
      <h1 class="text-xl sm:text-2xl font-extrabold text-slate-900 m-0">SiteHub Admin Hub</h1>
      <p class="text-xs sm:text-sm text-slate-500 mt-1.5">Enter your administrator credentials to continue</p>
    </div>

    {% if message %}
    <div class="bg-emerald-50 border border-emerald-200 text-emerald-800 px-3.5 py-2.5 rounded-xl text-xs font-semibold mb-4 flex items-center gap-2">
      <span>✅</span>
      <span>{{ message }}</span>
    </div>
    {% endif %}

    {% if error %}
    <div data-testid="admin-login-error" class="bg-red-50 border border-red-200 text-red-800 px-3.5 py-2.5 rounded-xl text-xs font-semibold mb-4 flex items-center gap-2">
      <span>❌</span>
      <span>{{ error }}</span>
    </div>
    {% endif %}

    <form method="post" action="/admin/login/" data-testid="admin-login-form" class="space-y-4">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next|default:'/admin/hub/' }}">

      <div>
        <label for="admin-username" class="block text-xs font-bold text-slate-700 mb-1.5">Admin Username or Phone</label>
        <input
          id="admin-username"
          type="text"
          name="username"
          data-testid="admin-username-input"
          required
          autocomplete="username"
          placeholder="e.g. admin"
          class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
        >
      </div>

      <div>
        <label for="admin-password" class="block text-xs font-bold text-slate-700 mb-1.5">Password</label>
        <div class="relative">
          <input
            id="admin-password"
            type="password"
            name="password"
            data-testid="admin-password-input"
            required
            autocomplete="current-password"
            placeholder="Enter admin password"
            class="w-full px-3.5 py-2.5 pr-12 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
          >
          <button
            type="button"
            onclick="const p=document.getElementById('admin-password'); p.type=p.type==='password'?'text':'password'; this.textContent=p.type==='password'?'Show':'Hide';"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-xs font-bold text-slate-500 hover:text-blue-600"
          >
            Show
          </button>
        </div>
      </div>

      <button
        type="submit"
        data-testid="admin-login-submit"
        class="w-full bg-blue-600 hover:bg-blue-700 active:scale-[0.99] text-white py-3 rounded-xl font-bold text-sm shadow-md transition cursor-pointer mt-2"
      >
        Sign In to Admin Hub →
      </button>
    </form>

    <div class="text-center mt-5 pt-4 border-t border-slate-100 flex items-center justify-between text-xs text-slate-400">
      <a href="/agent/portal/" class="hover:text-blue-600 font-medium transition">Agent Portal →</a>
      <a href="/" onclick="if(window.location.port==='8000'){window.location.href=window.location.protocol+'//'+window.location.hostname+':3000/';return false;}" class="hover:text-slate-600 font-medium transition">🏠 Home</a>
    </div>
  </div>
</body>
</html>
