<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SiteHub Agent Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin:0; font-family:'Inter',sans-serif; background:linear-gradient(135deg,#0f172a 0%,#1e3a5f 100%); min-height:100vh; display:flex; align-items:center; justify-content:center; }
  </style>
</head>
<body>
  <div style="background:#fff; border-radius:16px; padding:40px; width:360px; box-shadow:0 20px 60px rgba(0,0,0,0.3);">
    <div style="text-align:center; margin-bottom:28px;">
      <div style="font-size:36px; margin-bottom:8px;">🏢</div>
      <h1 style="font-size:22px; font-weight:800; color:#0f172a; margin:0;">SiteHub Agent Portal</h1>
      <p style="font-size:13px; color:#64748b; margin-top:6px;">Log in with your registered phone number</p>
    </div>

    {% if error %}
    <div style="background:#fee2e2; color:#991b1b; padding:10px 14px; border-radius:8px; font-size:13px; margin-bottom:16px;">
      ❌ {{ error }}
    </div>
    {% endif %}

    <form method="post" action="/agent/portal/login/">
      {% csrf_token %}
      <div style="margin-bottom:16px;">
        <label style="font-size:12px; font-weight:600; color:#374151; display:block; margin-bottom:5px;">Phone Number</label>
        <input type="tel" name="phone" required placeholder="Enter your registered phone" 
               style="width:100%; padding:10px 14px; border:1px solid #d1d5db; border-radius:8px; font-size:14px; box-sizing:border-box;">
      </div>
      <button type="submit" style="width:100%; background:#2563eb; color:#fff; padding:12px; border-radius:8px; border:none; font-size:14px; font-weight:700; cursor:pointer; margin-top:4px;">
        Sign In as Agent →
      </button>
    </form>

    <div style="text-align:center; margin-top:20px;">
      <a href="/" style="font-size:12px; color:#94a3b8; text-decoration:none;">← Back to SiteHub</a>
    </div>
  </div>
</body>
</html>
